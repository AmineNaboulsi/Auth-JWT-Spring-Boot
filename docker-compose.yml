services:
  postgres:
    image: postgres:15
    container_name: auth-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: authdbdashy
      POSTGRES_USER: authdbdashy
      POSTGRES_PASSWORD: authdbdashy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
